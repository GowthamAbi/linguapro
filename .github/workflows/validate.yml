name: Validate LinguaPro

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feature/supernova-inspired-experience"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-build:
    name: Client TypeScript and Vite build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install client dependencies
        working-directory: client
        run: npm install
      - name: Build client
        working-directory: client
        run: npm run build

  server-build:
    name: Server TypeScript build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install server dependencies
        working-directory: server
        run: npm install
      - name: Build server
        working-directory: server
        run: npm run build
